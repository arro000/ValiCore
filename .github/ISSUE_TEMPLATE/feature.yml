name: Feature or data proposal
description: Discuss a focused improvement before implementing it.
title: "Proposal: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: What integration or use case is difficult today? Describe the need rather than only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and alternatives
      description: Identify the owning domain/integration and whether it affects compatibility, runtime composition or data loading.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Authoritative evidence and dataset rights
      description: For rules/data, provide source URLs, jurisdiction/edition, independent examples and applicable reuse terms. Do not assume a pattern is normative.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This proposal contains no private data, credentials or customer identifiers.
          required: true
