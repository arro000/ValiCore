name: Verify, refresh, and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'artifacts/**', '.github/data-refresh-state.json']
  schedule:
    - cron: '17 5 1 * *'
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Start/retry geographic refresh (requires ENABLE_DATA_REFRESH)
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      site_ready: ${{ steps.publish.outputs.site_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify refresh policy without network
        run: python3 -m unittest discover -s tools/data -p 'test_refresh_*.py' -v
      - name: Configure automation identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Reject unauthorized manual refresh
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data && vars.ENABLE_DATA_REFRESH != 'true'
        run: |
          echo 'Enable ENABLE_DATA_REFRESH only after the source/publication go-no-go review.' >&2
          exit 1
      - name: Claim due refresh
        id: plan
        if: vars.ENABLE_DATA_REFRESH == 'true' && (github.event_name == 'schedule' || inputs.refresh_data)
        env:
          MONTHLY: ${{ github.event.schedule == '17 5 1 * *' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_data }}
        run: |
          args=(--retry-only)
          if [ "$MONTHLY" = true ]; then args=(); fi
          if [ "$MANUAL" = true ]; then args=(--manual --retry-only); fi
          python3 tools/data/refresh_policy.py plan --state .github/data-refresh-state.json "${args[@]}" > "$RUNNER_TEMP/refresh-plan.json"
          python3 - <<'PY'
          import json,os
          result=json.load(open(os.environ['RUNNER_TEMP']+'/refresh-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('action='+result['action']+'\n')
          PY
          # A durable remote claim MUST precede source requests. Ordinary push
          # rejection is safe; never force or discard a concurrent owner commit.
          git add -- .github/data-refresh-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record geographic refresh claim'
            git push origin HEAD:main
          fi
      - name: Import into an isolated staged copy
        id: refresh
        if: steps.plan.outputs.action == 'synchronize' && steps.plan.outcome == 'success'
        continue-on-error: true
        run: |
          cp -a data "$RUNNER_TEMP/refresh-data"
          python3 tools/data/sync.py --output "$RUNNER_TEMP/refresh-data"
      - name: Select verification work
        id: work
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_REFRESH: ${{ inputs.refresh_data }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          CHANGED: ${{ steps.refresh.outputs.changed }}
        run: |
          verify=false
          if [ "$EVENT" = push ] || { [ "$EVENT" = workflow_dispatch ] && [ "$MANUAL_REFRESH" != true ]; }; then verify=true; fi
          if [ "$REFRESH_OUTCOME" = success ] && [ "$CHANGED" = true ]; then
            cp -a "$RUNNER_TEMP/refresh-data/." data/
            verify=true
          fi
          echo "verify=$verify" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.work.outputs.verify == 'true'
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Install Python wheel build prerequisite
        if: steps.work.outputs.verify == 'true'
        run: python3 -m pip install 'setuptools>=77'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.work.outputs.verify == 'true'
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.work.outputs.verify == 'true'
      - name: Install verification dependencies
        if: steps.work.outputs.verify == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Complete current-source gate
        id: gate
        if: steps.work.outputs.verify == 'true'
        continue-on-error: true
        run: npm run test:extensive
      - name: Finish refresh and atomically promote verified data/state
        id: finish
        if: always() && steps.plan.outputs.action == 'synchronize' && steps.plan.outcome == 'success'
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          CHANGED: ${{ steps.refresh.outputs.changed }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          outcome=failed
          if [ "$REFRESH_OUTCOME" = success ] && [ "$CHANGED" = false ]; then outcome=unchanged; fi
          if [ "$REFRESH_OUTCOME" = success ] && [ "$CHANGED" = true ] && [ "$GATE_OUTCOME" = success ]; then outcome=changed; fi
          python3 tools/data/refresh_policy.py finish --state .github/data-refresh-state.json --outcome "$outcome" > "$RUNNER_TEMP/refresh-finish.json"
          status=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["state"]["campaign"]["status"])' "$RUNNER_TEMP/refresh-finish.json")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          git add -- .github/data-refresh-state.json
          # A late result is exhausted, even if validation happened to succeed.
          # Failed/unchanged runs never stage downloaded data or new artifacts.
          if [ "$status" = changed ]; then git add -- data artifacts; fi
          git commit -m 'chore: record verified geographic refresh outcome'
          git push origin HEAD:main
      - name: Report exhausted window once
        if: always() && (steps.plan.outputs.action == 'issue' || steps.finish.outputs.status == 'exhausted')
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(python3 tools/data/refresh_issue.py --state .github/data-refresh-state.json --repository "$REPOSITORY" --run-url "$RUN_URL")
          python3 tools/data/refresh_policy.py record-issue --state .github/data-refresh-state.json --issue "$number"
          git add -- .github/data-refresh-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: link geographic refresh failure issue'
            git push origin HEAD:main
          fi
      - name: Preserve verified code-build archives
        if: steps.gate.outcome == 'success' && steps.plan.outputs.action != 'synchronize'
        run: |
          git add -- artifacts
          if ! git diff --cached --quiet; then
            git commit -m 'chore: preserve verified runtime archives'
            git push origin HEAD:main
          fi
      - name: Fail unsuccessful verification or refresh
        if: always() && (steps.gate.outcome == 'failure' || steps.finish.outputs.status == 'pending' || steps.finish.outputs.status == 'exhausted')
        run: exit 1
      - name: Mark complete site for upload
        id: publish
        if: steps.gate.outcome == 'success' && (steps.plan.outputs.action != 'synchronize' || steps.finish.outputs.status == 'changed')
        run: echo 'site_ready=true' >> "$GITHUB_OUTPUT"
      - name: Upload preview site
        if: steps.publish.outputs.site_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: site
          include-hidden-files: true
      - uses: actions/configure-pages@v5
        if: steps.publish.outputs.site_ready == 'true' && (github.event.repository.private == false || vars.ENABLE_PAGES == 'true')
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.site_ready == 'true' && (github.event.repository.private == false || vars.ENABLE_PAGES == 'true')
        with:
          path: site
  deploy:
    if: needs.build.outputs.site_ready == 'true' && (github.event.repository.private == false || vars.ENABLE_PAGES == 'true')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published entrypoints
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 5 --retry-delay 5 "${PAGE_URL}dist/channels/v1/latest.json"
          curl --fail --retry 5 --retry-delay 5 "${PAGE_URL}demo/"
